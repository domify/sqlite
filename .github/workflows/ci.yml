name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # The oldest ris this release supports (README, Requirements).
      RIS_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install ris
        run: |
          curl -fsSL https://raw.githubusercontent.com/rislang/ris/main/install_ris.sh | RIS_PREFIX="$HOME/.ris" sh
          echo "$HOME/.ris/bin" >> "$GITHUB_PATH"

      - run: ris version

      - name: Test
        run: ris test sqlite

      - name: Build the examples
        run: |
          for program in examples/*.ri; do
            echo "building $program"
            ris build "$program" -o "$RUNNER_TEMP/example"
          done

      - name: Check formatting
        run: ris fmt --check sqlite examples
